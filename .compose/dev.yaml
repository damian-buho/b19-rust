---
name: ${M6E_COMPOSE_PROJECT_NAME}
services:
  b19-rust:
    container_name: ${M6E_CONTAINER_NAME}
    image: ${M6E_IMAGE_FULLNAME}
    labels:
      com.docker.compose.watch: 'true'
    command:
      - sleep
      - infinity
    networks:
      - dev-network
    environment:
      - LANG
    volumes:
      - /etc/localtime:/etc/localtime:ro
networks:
  dev-network:
    name: ${M6E_NETWORK}
    external: true
...