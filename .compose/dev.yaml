---
name: dev-b19-rust
services:
  b19-rust:
    container_name: dev-b19-rust
    image: ${DOCKER_IMAGE_FULLNAME}
    labels:
      com.docker.compose.watch: 'true'
    command:
    - sleep
    - infinity
    networks:
    - dev-b19-network
    environment:
    - LANG
    volumes:
    - /etc/localtime:/etc/localtime:ro
networks:
  dev-b19-network:
    name: dev-b19-network
    external: true
...